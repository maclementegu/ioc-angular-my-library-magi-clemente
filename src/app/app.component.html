<main class="contenidor">
  <header>
    <h1>{{ nomAplicacio }}</h1>
    <p>Projecte de Magí Clemente: un catàleg de llibres per consultar i organitzar la teva biblioteca.</p>
  </header>

  <app-llista-llibres
    [llibres]="llibres"
    [llibreSeleccionatId]="llibreSeleccionat?.id ?? null"
    (selecciona)="onSelecciona($event)"
  />

  <p>Llibre seleccionat: {{ llibreSeleccionat?.titol ?? 'cap' }}</p>
</main>
