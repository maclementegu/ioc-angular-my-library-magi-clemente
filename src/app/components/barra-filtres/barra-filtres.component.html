<form class="filtres" #formulari="ngForm" (ngSubmit)="onAplicar()" aria-label="Filtres del catàleg">
  <div class="camp">
    <label for="text">Cerca per títol o autor</label>
    <input
      id="text"
      name="text"
      type="search"
      [(ngModel)]="filtres.text"
      #campText="ngModel"
      required
      minlength="3"
      aria-describedby="text-ajuda text-error"
    />
    <small id="text-ajuda">Mínim 3 caràcters.</small>
    @if (campText.invalid && (campText.dirty || campText.touched)) {
      <strong id="text-error" class="error" role="alert">
        @if (campText.errors?.['required']) {
          Cal escriure un text de cerca.
        } @else {
          El text ha de tenir almenys 3 caràcters.
        }
      </strong>
    }
  </div>

  <div class="camp">
    <label for="categoria">Categoria</label>
    <select id="categoria" name="categoria" [(ngModel)]="filtres.categoria">
      <option value="">Totes</option>
      @for (categoria of categories; track categoria) {
        <option [value]="categoria">{{ categoria }}</option>
      }
    </select>
  </div>

  <div class="accions">
    <button type="submit" [disabled]="formulari.invalid">Aplicar filtres</button>
    <button type="button" (click)="onRestablir(formulari)">Restablir</button>
  </div>
</form>
